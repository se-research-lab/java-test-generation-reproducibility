protocol:
  version: "v3.1-pre-experiment"
  seed: 42
  target_repositories: 30
  minimum_unique_classes_per_repo: 12
  main_classes_per_repo: 10
  backup_classes_per_repo: 2

paths:
  dataset_root: "D:/material/SWT301/rsbln/New folder/classes2test"
  output_root: "D:/material/SWT301/rsbln/New folder/data_v3"
  java_env_file: "D:/material/SWT301/rsbln/New folder/research_pipeline/env/local.env"
  v2_data: "D:/material/SWT301/rsbln/New folder/data_v2"
  v2_pipeline: "D:/material/SWT301/rsbln/New folder/research_pipeline"
  proposal: "D:/material/SWT301/rsbln/New folder/classes2test/proposal (2).md"
  context: "D:/material/SWT301/rsbln/New folder/context.md"
  status: "D:/material/SWT301/rsbln/New folder/STATUS.md"
  history_guide: "D:/material/SWT301/rsbln/New folder/HDSD.md"
  backup_parent: "D:/material/SWT301/rsbln/New folder"

eligibility:
  min_nloc: 5
  max_nloc: 500
  require_public_non_constructor_method: true
  exclude_interfaces: true
  exclude_enums: true
  exclude_test_sources: true
  exclude_generated_code: true
  generated_path_segments: ["generated", "generated-sources", "generated-src"]
  generated_markers: ["@Generated", "@javax.annotation.Generated", "@jakarta.annotation.Generated", "generated by", "auto-generated", "automatically generated", "do not edit"]
  complexity_gate_enabled: false

java:
  effective_runtime: 8
  maximum_declared_version: 8
  accepted_declared_versions: [5, 6, 7, 8]
  try_unknown_version_on_jdk8: true
  run_all_accepted_versions_on_jdk8: true

build:
  clone_timeout_seconds: 900
  build_timeout_seconds: 900
  transient_retries: 2
  maximum_attempts_per_scope: 16
  prefer_repository_wrapper: true
  allow_global_tool_fallback: true
  allow_android: false
  keep_failed_repositories: false
  allow_ai_recipe_suggestion: false
  allow_source_code_modification: false
  allow_dependency_modification: false
  maven_settings_file: "D:/material/SWT301/rsbln/New folder/research_pipeline_v3/maven-settings-v3.xml"
  gradle_init_script: "D:/material/SWT301/rsbln/New folder/research_pipeline_v3/gradle-init-v3.gradle"
  external_repository_fallback_provenance: "Pre-registered from V2 curated repair evidence before V3 repository screening"
  maven_skip_flags:
    - "-Dcheckstyle.skip=true"
    - "-Dspotless.check.skip=true"
    - "-Dlicense.skip=true"
    - "-Drat.skip=true"
    - "-Dgpg.skip=true"
    - "-DskipNexusStagingDeployMojo=true"
    - "-Ddocker.skip=true"
    - "-DskipDocker"
    - "-Dfrontend.skip=true"
    - "-DskipNpm"
    - "-Dskip.npm=true"
    - "-Dskip.yarn=true"
    - "-Djacoco.skip=true"
    - "-Dpmd.skip=true"
    - "-Dfindbugs.skip=true"
    - "-Dspotbugs.skip=true"
  gradle_project_flags: []
  automatically_retry_categories:
    - network_dns
    - network_tls
    - timeout
    - wrapper_download_failed
    - out_of_memory

execution:
  metadata_workers: 16
  repository_limit: null
  csv_encoding: "utf-8-sig"

reproducibility:
  require_step_checksums: true
  preserve_prototype_unchanged: true
  record_exact_environment_versions: true
  requirements_file: "requirements-v3.txt"
